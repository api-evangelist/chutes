openapi: 3.2.0
info:
  title: Fast Model Aliases API
  version: 0.1.0
tags:
- name: Model Aliases
paths:
  /model_aliases/:
    get:
      tags:
      - Model Aliases
      summary: List Aliases
      operationId: list_aliases_model_aliases__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Model Aliases
      summary: Create Or Update Alias
      operationId: create_or_update_alias_model_aliases__post
      security:
      - APIKeyHeader: []
      parameters:
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelAliasCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /model_aliases/{alias}:
    delete:
      tags:
      - Model Aliases
      summary: Delete Alias
      operationId: delete_alias_model_aliases__alias__delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
          title: Alias
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ModelAliasCreate:
      properties:
        alias:
          type: string
          title: Alias
        chute_ids:
          items:
            type: string
          type: array
          title: Chute Ids
      type: object
      required:
      - alias
      - chute_ids
      title: ModelAliasCreate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: Authorization
