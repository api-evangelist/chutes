            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /miner/stats:
    get:
      tags:
      - Miner
      summary: Get Stats
      description: 'Get miner stats over different intervals based on instance data (matching actual scoring).


        Returns instance-based metrics (total_instances, compute_seconds, compute_units, bounty_count)

        which align with how miners are actually scored for validator weights.'
      operationId: get_stats_miner_stats_get
      parameters:
      - name: miner_hotkey
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Miner Hotkey
      - name: per_chute
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Per Chute
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /miner/scores:
    get:
      tags:
      - Miner
      summary: Get Scores
      operationId: get_scores_miner_scores_get
      parameters:
      - name: hotkey
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
