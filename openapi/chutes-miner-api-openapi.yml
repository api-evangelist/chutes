          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /miner/thrash_cooldowns:
    get:
      tags:
      - Miner
      summary: Get Thrash Cooldowns
      description: XXX Removed, no such thing, but return empty array for compat.
      operationId: get_thrash_cooldowns_miner_thrash_cooldowns_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /miner/metagraph:
    get:
      tags:
      - Miner
      summary: Get Metagraph
      operationId: get_metagraph_miner_metagraph_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
  /miner/instance_logs:
    get:
      tags:
      - Miner
      summary: Stream Miner Logs
      description: 'Stream startup logs for an instance identified by a launch config JWT.


        Only available for public chutes, and only before the instance is activated.

        Connections are capped at 5 minutes. To resume, pass the ``cursor`` query

        parameter (an ISO timestamp included as ``cursor`` in each JSON payload).'
      operationId: stream_miner_logs_miner_instance_logs_get
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: Authorization
