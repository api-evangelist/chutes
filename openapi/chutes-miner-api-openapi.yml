      summary: List Active Instances
      description: 'Get all active instances across the platform.

        Used by miners to make informed preemption decisions based on global state.'
      operationId: list_active_instances_miner_active_instances__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: X-Chutes-Hotkey
        in: header
