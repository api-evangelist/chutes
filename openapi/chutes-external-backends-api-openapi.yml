components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ExternalBackendAccountUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Name
        base_url:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          title: Base Url
        credentials:
          anyOf:
          - additionalProperties:
              type: string
              format: password
              writeOnly: true
            type: object
            maxProperties: 32
            minProperties: 1
          - type: 'null'
          title: Credentials
        remove_credentials:
          items:
            type: string
          type: array
          maxItems: 32
          title: Remove Credentials
        auth_header_templates:
          anyOf:
          - items:
              $ref: '#/components/schemas/ExternalAuthHeaderTemplate'
            type: array
            maxItems: 32
            minItems: 1
          - type: 'null'
          title: Auth Header Templates
        connection_config:
