  /encrypted_logs/{chute_id}/sessions/{instance_id}/chunks:
    get:
      tags:
      - Encrypted Logs
      summary: List Encrypted Log Chunks
      description: 'Fetch encrypted log chunks for a specific instance (owner only).


        Returns a list of base64-encoded encrypted chunks. The client must

        use the ephemeral_pubkey from the session metadata + their private

        key to ECDH-decrypt each chunk.'
      operationId: list_encrypted_log_chunks_encrypted_logs__chute_id__sessions__instance_id__chunks_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: chute_id
        in: path
        required: true
        schema:
          type: string
          title: Chute Id
      - name: instance_id
        in: path
        required: true
