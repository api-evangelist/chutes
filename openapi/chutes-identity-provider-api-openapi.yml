openapi: 3.2.0
info:
  title: Fast Identity Provider API
  version: 0.1.0
tags:
- name: Identity Provider
paths:
  /idp/scopes:
    get:
      tags:
      - Identity Provider
      summary: List Scopes
      description: 'List all available OAuth2 scopes with descriptions.

        This endpoint is public and can be used for documentation or scope selection UIs.'
      operationId: list_scopes_idp_scopes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
  /idp/cli_login/nonce:
    get:
      tags:
      - Identity Provider
      summary: Get Cli Login Nonce
      description: Get a nonce for CLI-based hotkey signature login.
      operationId: get_cli_login_nonce_idp_cli_login_nonce_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
  /idp/cli_login:
    get:
      tags:
      - Identity Provider
      summary: Cli Login
      description: CLI login endpoint for hotkey signature authentication.
      operationId: cli_login_idp_cli_login_get
      parameters:
      - name: hotkey
        in: query
        required: true
        schema:
          type: string
          title: Hotkey
      - name: signature
        in: query
        required: true
        schema:
          type: string
          title: Signature
      - name: nonce
        in: query
        required: true
        schema:
          type: string
          title: Nonce
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /idp/apps:
    get:
      tags:
      - Identity Provider
      summary: List Apps
      description: 'List OAuth applications.


        By default, returns apps owned by the current user, public apps, and apps shared with the user.

        Set include_public=false to exclude public apps.

        Set include_shared=false to exclude apps shared with the user.

        Use search to filter by name or description.'
      operationId: list_apps_idp_apps_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: include_public
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: true
          title: Include Public
      - name: include_shared
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: true
          title: Include Shared
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 0
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 25
          title: Limit
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Identity Provider
      summary: Create App
      description: Create a new OAuth application.
      operationId: create_app_idp_apps_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: X-Chutes-Hotkey
        in: header
        required: false
