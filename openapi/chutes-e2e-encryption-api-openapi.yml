openapi: 3.2.0
info:
  title: Fast E2E Encryption API
  version: 0.1.0
tags:
- name: E2E Encryption
paths:
  /e2e/instances/{chute_id}:
    get:
      tags:
      - E2E Encryption
      summary: Get E2E Instances
      description: Discover E2E-capable instances for a chute and get nonces for invocation.
      operationId: get_e2e_instances_e2e_instances__chute_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: chute_id
        in: path
        required: true
        schema:
          type: string
          title: Chute Id
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /e2e/invoke:
    post:
      tags:
      - E2E Encryption
      summary: E2E Invoke
      description: Relay an E2E encrypted invocation to a specific instance.
      operationId: e2e_invoke_e2e_invoke_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: X-Chute-Id
        in: header
        required: true
        schema:
          type: string
          title: X-Chute-Id
      - name: X-Instance-Id
        in: header
        required: true
        schema:
          type: string
          title: X-Instance-Id
      - name: X-E2E-Nonce
        in: header
        required: true
        schema:
          type: string
          title: X-E2E-Nonce
      - name: X-E2E-Stream
        in: header
        required: false
        schema:
          type: string
          default: 'false'
          title: X-E2E-Stream
      - name: X-E2E-Path
        in: header
        required: false
        schema:
          type: string
          default: /
          title: X-E2E-Path
      - name: X-E2EE-Usage-Passthrough
        in: header
        required: false
        schema:
          type: string
          default: 'false'
          title: X-E2Ee-Usage-Passthrough
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: Authorization
