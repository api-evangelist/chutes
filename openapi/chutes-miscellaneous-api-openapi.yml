openapi: 3.2.0
info:
  title: Fast Miscellaneous API
  version: 0.1.0
tags:
- name: Miscellaneous
paths:
  /misc/proxy:
    get:
      tags:
      - Miscellaneous
      summary: Proxy
      operationId: proxy_misc_proxy_get
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          title: Url
      - name: stream
        in: query
        required: false
        schema:
          type: boolean
          description: Stream the response for large files/videos
          default: false
          title: Stream
        description: Stream the response for large files/videos
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Miscellaneous
      summary: Proxy Put
      operationId: proxy_put_misc_proxy_put
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          title: Url
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /misc/hf_repo_info:
    get:
      tags:
      - Miscellaneous
      summary: Get Hf Repo Info
      description: Proxy endpoint for HF repo file info.
      operationId: get_hf_repo_info_misc_hf_repo_info_get
      parameters:
      - name: repo_id
        in: query
        required: true
        schema:
          type: string
          title: Repo Id
      - name: repo_type
        in: query
        required: false
        schema:
          type: string
          default: model
          title: Repo Type
      - name: revision
        in: query
        required: false
        schema:
          type: string
          default: main
          title: Revision
      - name: hf_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Hf Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: Authorization
