openapi: 3.2.0
info:
  title: Fast Job API
  version: 0.1.0
tags:
- name: Job
paths:
  /jobs/{chute_id}/{method}:
    post:
      tags:
      - Job
      summary: Create Job
      description: Create a job.
      operationId: create_job_jobs__chute_id___method__post
      security:
      - APIKeyHeader: []
      parameters:
      - name: chute_id
        in: path
        required: true
        schema:
          type: string
          title: Chute Id
      - name: method
        in: path
        required: true
        schema:
          type: string
          title: Method
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}:
    delete:
      tags:
      - Job
      summary: Delete Job
      description: Delete a job.
      operationId: delete_job_jobs__job_id__delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Job
      summary: Finish Job And Get Upload Targets
      description: Mark a job as complete (which could be failed; "done" either way)
      operationId: finish_job_and_get_upload_targets_jobs__job_id__post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: token
        in: query
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Job
      summary: Complete Job
      description: Final update, which checks the file uploads to see which were successfully transferred etc.
      operationId: complete_job_jobs__job_id__put
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: token
        in: query
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Job
      summary: Get Job
      description: Get a job.
      operationId: get_job_jobs__job_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/upload:
    put:
      tags:
      - Job
      summary: Upload Job File
      description: Upload a job's output file.
      operationId: upload_job_file_jobs__job_id__upload_put
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: token
        in: query
        required: true
        schema:
          type: string
          title: Token
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_job_file_jobs__job_id__upload_put'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/download/{file_id}:
    get:
      tags:
      - Job
      summary: Download Output File
      description: Download a job's output file.
      operationId: download_output_file_jobs__job_id__download__file_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Body_upload_job_file_jobs__job_id__upload_put:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        path:
          type: string
          title: Path
      type: object
      required:
      - file
      - path
      title: Body_upload_job_file_jobs__job_id__upload_put
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: Authorization
