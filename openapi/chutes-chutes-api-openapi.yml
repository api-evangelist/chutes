  /chutes/{chute_id_or_name}/evidence:
    get:
      tags:
      - Chutes
      summary: Get Tee Chute Evidence
      description: 'Get TEE evidence for all instances of a chute (quote, GPU evidence, certificate per instance).


        Args:

        chute_id_or_name: Chute ID or name

        nonce: User-provided nonce (64 hex characters, 32 bytes)

        include_amd: Include AMD SEV-SNP instances (see the AMD evidence rollout in api.server.util)


        Returns:

        TeeChuteEvidence with array of TEE instance evidence per instance. AMD SEV-SNP instances

        left out are listed in excluded_instance_ids, and the response then carries Deprecation

        and Sunset headers naming the date they start being included by default.


        Raises:

        404: Chute not found

        400: Invalid nonce format or chute not TEE-enabled

        403: User cannot access chute

        429: Rate limit exceeded (per caller, or per client IP when anonymous, plus a global

        ceiling; 4xx responses only count toward a looser cap on all attempts)

        500: Server attestation failures'
      operationId: get_tee_chute_evidence_chutes__chute_id_or_name__evidence_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: chute_id_or_name
        in: path
        required: true
        schema:
          type: string
          title: Chute Id Or Name
      - name: nonce
        in: query
        required: true
        schema:
          type: string
          title: Nonce
      - name: include_amd
        in: query
        required: false
        schema:
          type: boolean
          description: 'Include AMD SEV-SNP instances (tee_type snp: the quote is an SEV-SNP attestation report). Set true once your verifier handles them. The default becomes true on the date in the Sunset header.'
          default: false
          title: Include Amd
        description: 'Include AMD SEV-SNP instances (tee_type snp: the quote is an SEV-SNP attestation report). Set true once your verifier handles them. The default becomes true on the date in the Sunset header.'
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
