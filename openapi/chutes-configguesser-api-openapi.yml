openapi: 3.2.0
info:
  title: Fast Config Guesser API
  version: 0.1.0
tags:
- name: ConfigGuesser
paths:
  /guess/vllm_config:
    get:
      tags:
      - ConfigGuesser
      summary: Analyze Model
      description: Attempt to guess required GPU count and VRAM for a model on huggingface, assuming safetensors format.
      operationId: analyze_model_guess_vllm_config_get
      parameters:
      - name: model
        in: query
        required: true
        schema:
          type: string
          title: Model
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: Authorization
