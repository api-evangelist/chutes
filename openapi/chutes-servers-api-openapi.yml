openapi: 3.2.0
info:
  title: Fast Servers API
  version: 0.1.0
tags:
- name: Servers
paths:
  /servers/nonce:
    get:
      tags:
      - Servers
      summary: Get Nonce
      description: 'Generate a nonce for boot attestation.


        This endpoint is called by VMs during boot before any registration.

        No authentication required as the VM doesn''t exist in the system yet.


        miner_hotkey is OPTIONAL for backwards compatibility: older VM initramfs fetch the nonce

        without it. When supplied it is bound into the nonce, and boot attestation enforces that

        args.miner_hotkey matches the value stored here (preventing cross-miner nonce reuse). VMs

        that omit it get an unbound nonce and the binding check is skipped.


        TODO: make miner_hotkey required when all VMs >= 1.4.0'
      operationId: get_nonce_servers_nonce_get
      parameters:
      - name: miner_hotkey
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Miner Hotkey
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /servers/boot/attestation:
    post:
      tags:
      - Servers
      summary: Verify Boot Attestation
      description: 'Verify boot attestation and return LUKS passphrase.


        Both VM generations reach this route, so the hotkey proof is EXTRACTED rather than required:

        a presented signature is verified here and 401s if it does not hold, but its absence is left

        for the handler to judge once the quote names the attested image. See

        process_boot_attestation, which requires a proof from any image whose measured initramfs

        ships the signer.


        Verifies the TDX quote against the expected boot measurements and returns the LUKS passphrase

        for disk decryption if valid. For VMs >= 1.3.0 it also returns a luks_quote_nonce for the

        following runtime call (POST /provision on 1.4.0+, POST /luks/attest on 1.3.x); for 1.4.0+ it

        additionally returns root_next + root_confirm_nonce and the VM''s ephemeral auth SS58.'
      operationId: verify_boot_attestation_servers_boot_attestation_post
      parameters:
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootAttestationArgs'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /servers/{vm_name}/luks/attest:
    post:
      tags:
      - Servers
      summary: Attest Luks
      description: 'Rotate LUKS passphrases for new-format VMs (version >= 1.3.0).


        DEPRECATED: superseded by POST /provision, which does the same storage rotation and

        additionally records the VM root CA identity. Kept unchanged for legacy in-field VMs;

        retire once the fleet upgrades.


        The VM embeds the luks_quote_nonce (received in the boot attestation response)

        in a TDX quote after extending RTMR3 in initramfs. require_luks_quote_nonce

        validates and consumes the nonce; the handler then calls verify_quote which

        checks the TDX signature and all RTMR measurements including RTMR3. Returns

        rotated passphrases, the k3s encryption key, and a confirm nonce.'
      operationId: attest_luks_servers__vm_name__luks_attest_post
      parameters:
      - name: vm_name
        in: path
        required: true
        schema:
          type: string
          title: Vm Name
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Quote-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Quote-Nonce
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LuksAttestRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /servers/{vm_name}/luks/confirm:
    post:
      tags:
      - Servers
      summary: Confirm Luks Rotation
      description: 'Confirm or discard pending LUKS passphrase rotation results.


        DEPRECATED for the storage-rotation flow: new VMs use POST /provision/confirm (same

        shared logic). Kept for legacy in-field VMs; note the boot-phase root-passphrase confirm

        still uses this route until /luks/* is fully retired.


        The VM reports per-volume success/failure. require_confirm_nonce validates

        and consumes the nonce before the handler runs. Volumes with rotated=True

        have pending passphrases promoted to current; rotated=False discards pending.'
      operationId: confirm_luks_rotation_servers__vm_name__luks_confirm_post
      parameters:
      - name: vm_name
        in: path
        required: true
        schema:
          type: string
          title: Vm Name
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Confirm-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Confirm-Nonce
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LuksConfirmRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /servers/{vm_name}/provision:
    post:
      tags:
      - Servers
      summary: Provision
      description: 'Provision a new VM at runtime: record its root CA identity and issue storage secrets.


        Only 1.4.0+ VMs reach this route (it is behind require_cvm_proxy), and every one of them

        signs, so require_hotkey_auth demands a proven hotkey at the door -- no backwards-compatible

        "unsigned is acceptable" case exists here, unlike boot attestation. The proven identity is

        what the rc gate in verify_quote is given.


        The RTMR3-attested runtime entry point for new VMs (supersedes /luks/attest going

        forward). The VM presents its per-boot root CA as the mTLS client cert; the quote''s

        REPORTDATA binds SHA256(that cert''s pubkey), so the same cert_hash check that guards

        /luks/attest also proves CA possession — no bespoke quote logic is needed.

        require_luks_quote_nonce validates and consumes the runtime nonce; the handler verifies

        the quote (signature + all RTMR measurements incl. RTMR3), records

        server.vm_root_ca_cert (idempotent), and returns rotated passphrases, the k3s encryption

        key, and a confirm nonce.'
      operationId: provision_servers__vm_name__provision_post
      parameters:
      - name: vm_name
        in: path
        required: true
        schema:
          type: string
          title: Vm Name
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Quote-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Quote-Nonce
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /servers/{vm_name}/provision/confirm:
    post:
      tags:
      - Servers
      summary: Provision Confirm
      description: 'Confirm or discard pending storage-passphrase rotations from POST /provision.


        Delegates to the same shared logic as the legacy /luks/confirm (process_luks_confirm):

        require_confirm_nonce validates and consumes the nonce, then volumes with rotated=True

        have pending passphrases promoted to current and rotated=False discards pending.'
      operationId: provision_confirm_servers__vm_name__provision_confirm_post
      parameters:
      - name: vm_name
        in: path
        required: true
        schema:
          type: string
          title: Vm Name
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Confirm-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Confirm-Nonce
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LuksConfirmRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /servers/:
    post:
      tags:
      - Servers
      summary: Create Server
      description: 'Register a new server.


        This is called via CLI after the server has booted and decrypted its disk.

        Links the server to any existing boot attestation history via server ip.'
      operationId: create_server_servers__post
      security:
      - APIKeyHeader: []
      parameters:
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerArgs'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /servers/tee/measurements:
    get:
      tags:
      - Servers
      summary: Get Tee Measurements
      description: 'Deprecated: use GET /servers/tdx/measurements (and /servers/snp/measurements for AMD).


        The accepted Intel TDX measurements in their original shape, with boot and runtime RTMR sets.

        Frozen as TDX-only; it switches to a combined format around the date in its Sunset header.

        No authentication required — public transparency endpoint.'
      operationId: get_tee_measurements_servers_tee_measurements_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
      deprecated: true
  /servers/tdx/measurements:
    get:
      tags:
      - Servers
      summary: Get Tdx Measurements
      description: 'The accepted Intel TDX measurements: the MRTD and RTMR0-3 a runtime quote must carry, per

        published VM image and host class. A boot quote carries the same values with RTMR3 all-zeros.


        Join each of `fingerprints` to GET /servers/tdx/host_profiles to reproduce RTMR0 for a

        host class.

        Release candidates are never listed. No authentication required — public transparency endpoint.'
      operationId: get_tdx_measurements_servers_tdx_measurements_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
  /servers/snp/measurements:
    get:
      tags:
      - Servers
      summary: Get Snp Measurements
      description: 'The accepted AMD SEV-SNP measurements: the launch digest a report''s MEASUREMENT must equal,

        per published VM image and host class. The report must also meet its product line''s

        requirements (GET /servers/snp/product_lines).


        Release candidates are never listed. No authentication required — public transparency endpoint.'
      operationId: get_snp_measurements_servers_snp_measurements_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
  /servers/snp/product_lines:
    get:
      tags:
      - Servers
      summary: Get Snp Product Lines
      description: 'What an AMD SEV-SNP report must satisfy beyond its measurement, per AMD product line: the ARK

        fingerprint its VCEK chain must end in, the CPU variants accepted (by the report''s CPUID family,

        model and stepping) with each one''s minimum reported TCB, and the PLATFORM_INFO and

        mitigation-vector bits that must be set.


        Everything a third party needs to repeat our acceptance checks. A product line or variant not

        listed is not accepted. No authentication required — public transparency endpoint.'
      operationId: get_snp_product_lines_servers_snp_product_lines_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
  /servers/tdx/host_profiles:
    get:
      tags:
      - Servers
      summary: List Host Profiles
      description: 'Return host profiles: the platform inputs a measurement is built from.


        By default, only host classes that HAVE measurements. Each entry''s `tee_type` says which

        platform it attests under. Find `fingerprint` in the `fingerprints` of that platform''s

        measurements (GET /servers/tdx/measurements or /servers/snp/measurements), regenerate the

        measurement from the

        inputs here, and compare -- that makes every published measurement independently

        reproducible, and a quote holder can see which host class their own measurement corresponds

        to. A third party needs no flags and can never be handed an unverified claim.


        `include_pending=true` also returns host classes awaiting generation. That is the measurement

        generator''s queue: a profile becomes measured only once measurements are generated for it, and

        generation has to fetch it first. Each entry''s `measured` flag says which set it is in.


        Public and unauthenticated, so the generation side needs no database credentials. Every entry

        is host-class data: the machine-identifying fields are dropped at submission and never stored,

        and the submitter''s `miner_hotkey` is a column this query never selects.'
      operationId: list_host_profiles_servers_tdx_host_profiles_get
      parameters:
      - name: include_pending
        in: query
        required: false
        schema:
          type: boolean
          description: Also return host classes awaiting measurement generation.
          default: false
          title: Include Pending
        description: Also return host classes awaiting measurement generation.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Servers
      summary: Submit Host Profile
      description: 'Register a host class (sek8s `discover-profile.sh` output) so Chutes can measure it.


        One of four distinct operations: this REGISTERS, POST /servers/tdx/host_profiles/status

        RESOLVES a class (is it known, and for which images), POST /servers/tdx/preflight CHECKS whether

        one specific image can boot, and GET /servers/tdx/host_profiles LISTS the generated set. A miner

        reaches this only when the status lookup reports the class is not on file. The API owns the

        fingerprint -- the miner sends raw platform metadata and gets back the class''s retention

        lifecycle, which only ever advances:


        * `accepted` -- a measurement has already been generated for this class; retained from here on

        * `pending` -- parked in object storage, awaiting its first measurement generation


        A real submission is always stored, so this never returns `unknown`. It answers only whether the

        class has been measured at all; whether the caller''s specific image can boot is preflight''s job.

        Signed by the miner hotkey, so the signature covers the request body.'
      operationId: submit_host_profile_servers_tdx_host_profiles_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostProfile'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /servers/tdx/host_profiles/status:
    post:
      tags:
      - Servers
      summary: Tdx Host Profile Status
      description: 'Is this Intel TDX host class known, and which VM images cover it? The check

        `chutes-cvm host verify` runs, and the launch''s Step 1. An AMD class is answered by

        POST /servers/snp/host_profiles/status.


        Deliberately version-free: a miner verifies a host BEFORE downloading any image, so this asks

        only about the topology -- "can this host run anything at all, and if so what".


        * `measurements` non-empty -> the class is attestable; those are the images it can launch.

        * empty, `status: pending` -> registered, awaiting measurement generation. Nothing to do but

        retry later; re-submitting will not speed it up.

        * empty, `status: unknown` -> never submitted. Register it with

        POST /servers/tdx/host_profiles.


        A POST because the API owns the fingerprint: a caller cannot ask about "my topology" without

        handing over the profile to be fingerprinted. Stores nothing -- the read-only counterpart to the

        submission route. Signed by the miner hotkey, so the signature covers the request body.'
      operationId: tdx_host_profile_status_servers_tdx_host_profiles_status_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostProfile'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /servers/snp/host_profiles/status:
    post:
      tags:
      - Servers
      summary: Snp Host Profile Status
      description: 'Is this AMD SEV-SNP host class known, and which VM images cover it? The same question as

        POST /servers/tdx/host_profiles/status, for SEV-SNP classes.


        Each covered image also carries `acpi_sha256`: the hash of the class''s ACPI tables, which

        the guest firmware checks against `sek8s.acpi_sha256` on the kernel cmdline. The launch puts it

        there; without it the image cannot boot.'
      operationId: snp_host_profile_status_servers_snp_host_profiles_status_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostProfile'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /servers/tdx/preflight:
    post:
      tags:
      - Servers
      summary: Tdx Preflight
      description: 'Can this exact image boot on this host? The one call a launch/upgrade preflight makes.


        A check against both a host profile and the measurement set, so it hangs off neither. The API

        fingerprints the submitted profile and answers whether a published measurement for the caller''s

        `(version, rc)` carries that fingerprint -- the whole launch decision in one boolean:


        * `launchable: true` -> the VM will attest; launch.

        * `launchable: false` -> register the class (POST /servers/tdx/host_profiles), then retry once

        Chutes publishes its measurement.


        Stores nothing and reveals nothing beyond the answer -- not the full measurement set, not

        whether a profile row exists. Signed by the miner hotkey, so the signature covers the body.'
      operationId: tdx_preflight_servers_tdx_preflight_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: version
        in: query
        required: true
        schema:
          type: string
          description: VM image version the caller intends to boot.
          title: Version
        description: VM image version the caller intends to boot.
      - name: rc
        in: query
        required: false
        schema:
          type: boolean
          description: Whether that image is a release-candidate (debug) build.
          default: false
          title: Rc
        description: Whether that image is a release-candidate (debug) build.
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostProfile'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /servers/signing-keys:
    get:
      tags:
      - Servers
      summary: Get Signing Keys
      description: 'Return the signed key bundle used by booting VMs to fetch and verify cosign/Helm keys.


        Each entry in ''keys'' is a base64-encoded public key; the corresponding entry in

        ''signatures'' is a base64-encoded RSA signature (PKCS#1 v1.5 over SHA-256) produced

        offline by the root signing key in Cloud KMS. Nothing here can sign; this only serves.

        Intentionally public — no mTLS required. Independent third parties and auditors can

        fetch these public keys to verify TDX quotes without needing to be a VM client.'
      operationId: get_signing_keys_servers_signing_keys_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
