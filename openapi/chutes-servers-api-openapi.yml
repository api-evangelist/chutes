components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HostProfileIbDevice:
      properties:
        vendor:
          type: string
          pattern: ^[0-9a-fA-F]{4}$
          title: Vendor
        device_id:
          type: string
          pattern: ^[0-9a-fA-F]{4}$
          title: Device Id
        pci_class:
          type: string
          pattern: ^([0-9a-fA-F]{4})?$
          title: Pci Class
        numa_node:
          type: integer
          maximum: 64.0
          minimum: -1.0
          title: Numa Node
        bars:
          items:
            $ref: '#/components/schemas/HostProfilePciBar'
          type: array
          maxItems: 6
          title: Bars
        is_bridge_pf:
          type: boolean
          title: Is Bridge Pf
          default: false
        is_vf:
          type: boolean
          title: Is Vf
          default: false
      additionalProperties: false
      type: object
      required:
      - vendor
      - device_id
      - pci_class
      - numa_node
      - bars
      title: HostProfileIbDevice
      description: 'One InfiniBand device, plus the two flags that decide whether it is passed through.


        `is_bridge_pf` comes from VPD, which needs root -- an unprivileged capture reports every PF

        as non-bridge.'
    HostProfileCpu:
      properties:
        count:
          type: integer
          maximum: 8192.0
          minimum: 1.0
          title: Count
        sockets:
          type: integer
          maximum: 64.0
          minimum: 1.0
          title: Sockets
        vendor:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9 _.()-]*$
          title: Vendor
        processor_id:
          anyOf:
          - type: string
            pattern: ^[0-9a-fA-F]{1,32}$
          - type: 'null'
          title: Processor Id
      additionalProperties: false
      type: object
      required:
      - count
      - sockets
      - vendor
      - processor_id
      title: HostProfileCpu
      description: 'The host CPU facts that reach RTMR0: the guest -smp and the SMBIOS Type-4 identity.


        Mirrors chutes-cvm''s `HostCpu` field for field. `processor_id` is nullable -- CPUID leaf-1 is

        unreadable on some hosts -- but the key is required, and generation refuses a null rather than

        measuring its own host''s CPU.'
    HostProfile:
      properties:
        gpus:
          items:
            $ref: '#/components/schemas/HostProfileGpuDevice'
          type: array
          maxItems: 64
          minItems: 1
          title: Gpus
        nvswitches:
          items:
            $ref: '#/components/schemas/HostProfileNvswitchDevice'
          type: array
          maxItems: 256
          title: Nvswitches
        ib_devices:
          items:
            $ref: '#/components/schemas/HostProfileIbDevice'
          type: array
          maxItems: 256
          title: Ib Devices
        cpu:
          $ref: '#/components/schemas/HostProfileCpu'
        memory:
          $ref: '#/components/schemas/HostProfileMemory'
        numa:
          $ref: '#/components/schemas/HostProfileNuma'
        qemu:
          $ref: '#/components/schemas/HostProfileQemu'
      additionalProperties: false
      type: object
      required:
      - gpus
      - cpu
      - memory
      - numa
      - qemu
      title: HostProfile
      description: 'One host class, as chutes-cvm''s ``HostProfile.to_api_profile()`` submits it.


        A direct translation of the client''s own model: the RTMR0 determinants and nothing else.

        Stored == hashed == required, one set. An unhashed field stored beside a hashed one would

        re-split the class at the byte level -- two hosts that measure identically would differ in the

        stored row, and first-write-wins would silently drop one of them. That is why host RAM, BDFs,

        DMI strings and the lspci tree are absent rather than merely excluded.


        Every block forbids extras, so a client that adds a key 422s until the API models it: add the

        field here, deploy, then roll out the client.'
    ProvisionRequest:
      properties:
        quote:
          type: string
          title: Quote
          description: Base64-encoded TDX quote (runtime type, RTMR3 extended)
        volumes:
          items:
            type: string
          type: array
          title: Volumes
          description: Volume names to rotate passphrases for
      type: object
      required:
      - quote
      - volumes
      title: ProvisionRequest
      description: 'Request model for POST /servers/{vm_name}/provision.


        The runtime (RTMR3-attested) provisioning entry point for new VMs. The VM presents its

        root CA as the mTLS client cert; the quote''s REPORTDATA binds SHA256(that cert''s pubkey),

        so the CA identity is recorded from this call. Mirrors the luks/attest body today (quote

        + volumes) and is the extensible home for future provisioning inputs.'
    NodeArgs:
      properties:
        uuid:
          type: string
          title: Uuid
        name:
          type: string
          title: Name
        memory:
          type: integer
          title: Memory
        major:
          anyOf:
          - type: integer
          - type: 'null'
          title: Major
        minor:
          anyOf:
          - type: integer
          - type: 'null'
          title: Minor
        processors:
          anyOf:
          - type: integer
          - type: 'null'
          title: Processors
        sxm:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Sxm
        clock_rate:
          type: number
          title: Clock Rate
        max_threads_per_processor:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Threads Per Processor
        concurrent_kernels:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Concurrent Kernels
        ecc:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ecc
        device_index:
          type: integer
          exclusiveMaximum: 10.0
          minimum: 0.0
          title: Device Index
        gpu_identifier:
          type: string
          title: Gpu Identifier
        verification_host:
          type: string
          title: Verification Host
        verification_port:
          type: integer
          title: Verification Port
      type: object
      required:
      - uuid
      - name
      - memory
      - clock_rate
      - device_index
      - gpu_identifier
      - verification_host
      - verification_port
      title: NodeArgs
    HostProfileMemory:
      properties:
        guest_gb:
          type: integer
          maximum: 262144.0
          minimum: 1.0
          title: Guest Gb
      additionalProperties: false
      type: object
      required:
      - guest_gb
      title: HostProfileMemory
      description: 'Guest RAM, as the client resolved it.


        Not host RAM: the sizing rules are per-GPU-profile and live in chutes-cvm, so the client sends

        the answer. Storing the host total instead would split hosts that measure identically -- 2007

        and 2011 GB are one H200 class.'
    HostProfileNvswitchDevice:
      properties:
        vendor:
          type: string
          pattern: ^[0-9a-fA-F]{4}$
          title: Vendor
        device_id:
          type: string
          pattern: ^[0-9a-fA-F]{4}$
          title: Device Id
        pci_class:
          type: string
          pattern: ^([0-9a-fA-F]{4})?$
          title: Pci Class
        numa_node:
          type: integer
          maximum: 64.0
          minimum: -1.0
          title: Numa Node
        bars:
          items:
            $ref: '#/components/schemas/HostProfilePciBar'
          type: array
          maxItems: 6
          title: Bars
      additionalProperties: false
      type: object
      required:
      - vendor
      - device_id
      - pci_class
      - numa_node
      - bars
      title: HostProfileNvswitchDevice
      description: One NVSwitch. Its BARs shape the guest DSDT, so it is modeled like any other endpoint.
    BootAttestationArgs:
      properties:
        quote:
          type: string
          title: Quote
          description: Base64 encoded TDX quote
        miner_hotkey:
          type: string
          title: Miner Hotkey
          description: Miner hotkey that owns this VM
        vm_name:
          type: string
          title: Vm Name
          description: VM name/identifier
        first_boot:
          type: boolean
          title: First Boot
          description: True when the VM detected a fresh (re-downloaded) image via its LUKS2 header token
          default: false
      type: object
      required:
      - quote
      - miner_hotkey
      - vm_name
      title: BootAttestationArgs
      description: Request model for boot attestation.
    HostProfileNuma:
      properties:
        node_count:
          type: integer
          maximum: 64.0
          minimum: 1.0
          title: Node Count
      additionalProperties: false
      type: object
      required:
      - node_count
      title: HostProfileNuma
      description: 'Host NUMA node count: it picks the guest''s memory-map and PXB-PCIe grouping.'
    HostProfileGpuDevice:
      properties:
        vendor:
          type: string
          pattern: ^[0-9a-fA-F]{4}$
          title: Vendor
        device_id:
          type: string
          pattern: ^[0-9a-fA-F]{4}$
          title: Device Id
        pci_class:
          type: string
          pattern: ^([0-9a-fA-F]{4})?$
          title: Pci Class
        numa_node:
          type: integer
          maximum: 64.0
          minimum: -1.0
          title: Numa Node
        bars:
          items:
            $ref: '#/components/schemas/HostProfilePciBar'
          type: array
          maxItems: 6
          minItems: 1
          title: Bars
      additionalProperties: false
      type: object
      required:
      - vendor
      - device_id
      - pci_class
      - numa_node
      - bars
      title: HostProfileGpuDevice
      description: 'One passthrough GPU.


        Unlike the other endpoints, a GPU must report BARs. They are what the measurement generator

        reproduces as a `pci-bar-stub`, so a GPU with none yields a guest whose MMIO windows -- and

        therefore RTMR0 -- do not match any real boot. That is not a host we can measure, and storing

        it would create a class whose published measurement nothing can attest against.'
    HostProfileQemu:
      properties:
        qemu_version:
          type: string
          maxLength: 64
          pattern: ^[0-9][0-9A-Za-z.+~:_-]*$
          title: Qemu Version
      additionalProperties: false
      type: object
      required:
      - qemu_version
      title: HostProfileQemu
      description: The QEMU that builds the guest ACPI measured into RTMR0.
    ServerArgs:
      properties:
        host:
          type: string
          title: Host
          description: Public IP address or DNS Name of the server
        id:
          type: string
          title: Id
          description: Server ID (e.g. k8s node uid)
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Server name (defaults to server id if omitted)
        gpus:
          items:
            $ref: '#/components/schemas/NodeArgs'
          type: array
          title: Gpus
          description: GPU info for this server
      type: object
      required:
      - host
      - id
      - gpus
      title: ServerArgs
      description: Request model for server registration.
    LuksConfirmRequest:
      properties:
        volumes:
          additionalProperties:
            $ref: '#/components/schemas/LuksVolumeConfirmStatus'
          type: object
          title: Volumes
          description: Per-volume rotation result reported by the VM
      type: object
      required:
      - volumes
      title: LuksConfirmRequest
      description: Request model for POST /luks/confirm.
    LuksAttestRequest:
      properties:
        quote:
          type: string
          title: Quote
          description: Base64-encoded TDX quote (runtime type, RTMR3 extended)
        volumes:
          items:
            type: string
          type: array
          title: Volumes
          description: Volume names to rotate passphrases for
      type: object
      required:
      - quote
      - volumes
      title: LuksAttestRequest
      description: Request model for POST /luks/attest.
    LuksVolumeConfirmStatus:
      properties:
        rotated:
          type: boolean
          title: Rotated
          description: True if passphrase rotation succeeded for this volume; False to discard pending
      type: object
      required:
      - rotated
      title: LuksVolumeConfirmStatus
      description: Confirm status for a single volume.
    HostProfilePciBar:
      properties:
        index:
          type: integer
          exclusiveMaximum: 6.0
          minimum: 0.0
          title: Index
        size_mb:
          type: integer
          maximum: 16777216.0
          minimum: 0.0
          title: Size Mb
        kind:
          type: string
          pattern: ^[mp](32|64)$
          title: Kind
      additionalProperties: false
      type: object
      required:
      - index
      - size_mb
      - kind
      title: HostProfilePciBar
      description: 'One MMIO window of a passthrough device, from an lspci "Region N" line.


        Offline measurement generation reproduces these windows with a ``pci-bar-stub``, so the

        guest ACPI it measures matches what a real passthrough launch produces -- which makes the

        layout an RTMR0 input, and part of the class fingerprint. Most BARs are fixed per GPU model,

        but the large one (BAR2 on H200/B200/RTX) is RESIZABLE: host firmware sets its current size,

        so two otherwise identical machines can need different RTMR0s. Fingerprinting the layout is

        what keeps those apart instead of collapsing them into one class whose measurement only one

        of them can attest against.'
