openapi: 3.2.0
info:
  title: Fast Logo API
  version: 0.1.0
tags:
- name: Logo
paths:
  /logos/:
    post:
      tags:
      - Logo
      summary: Create Logo
      description: Create/upload a new logo.
      operationId: create_logo_logos__post
      security:
      - APIKeyHeader: []
      parameters:
      - name: X-Chutes-Hotkey
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Hotkey
      - name: X-Chutes-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Signature
      - name: X-Chutes-Nonce
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Chutes-Nonce
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_logo_logos__post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /logos/{logo_id}.{extension}:
    get:
      tags:
      - Logo
      summary: Render Logo
      description: Logo image response.
      operationId: render_logo_logos__logo_id___extension__get
      parameters:
      - name: logo_id
        in: path
        required: true
        schema:
          type: string
          title: Logo Id
      - name: extension
        in: path
        required: true
        schema:
          type: string
          title: Extension
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Body_create_logo_logos__post:
      properties:
        logo:
          type: string
          contentMediaType: application/octet-stream
          title: Logo
      type: object
      required:
      - logo
      title: Body_create_logo_logos__post
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: Authorization
