    type: Documentation
  - url: https://chutes.ai/docs/api-reference/overview
    type: APIReference
  - url: openapi/chutes-openapi.yml
    type: OpenAPI
  - url: collections/chutes.postman_collection.json
    type: Postman
  description: Image generation (diffusion), embeddings, audio, and other non-chat
    model workloads are exposed as user-defined "cords" (decorated HTTP endpoints)
