aid: chutes
url: https://raw.githubusercontent.com/api-evangelist/chutes/refs/heads/main/apis.yml
name: Chutes
kind: company
description: Chutes is a permissionless, serverless AI compute platform that lets developers deploy and
  run any model as an autoscaling "chute" on decentralized GPU capacity (Bittensor Subnet 64). It exposes
  a single OpenAI-compatible inference endpoint at llm.chutes.ai/v1 for hundreds of open-source LLMs,
  plus a management REST API at api.chutes.ai for building images and deploying, listing, and operating
  chutes.
