aid: chutes
url: https://raw.githubusercontent.com/api-evangelist/chutes/refs/heads/main/apis.yml
name: Chutes
kind: company
description: Chutes is a permissionless, serverless AI compute platform that lets
  developers deploy and run any model as an autoscaling "chute" on decentralized GPU
  capacity (Bittensor Subnet 64). It exposes a single OpenAI-compatible inference
  endpoint at llm.chutes.ai/v1 for hundreds of open-source LLMs, plus a management
  REST API at api.chutes.ai for building images and deploying, listing, and operating
  chutes.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- AI
- LLM
- Inference
- Serverless
- GPU
- Bittensor
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
apis:
- aid: chutes:chutes-llm-inference-api
  name: Chutes LLM Inference (Chat Completions) API
  tags:
  - Chat
  - Completions
  - LLM
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://chutes.ai/docs/examples/llm-chat
  baseURL: https://llm.chutes.ai/v1
  properties:
  - url: https://chutes.ai/docs/examples/llm-chat
    type: Documentation
  - url: https://chutes.ai/docs/api-reference/overview
    type: APIReference
  - url: openapi/chutes-openapi.yml
    type: OpenAPI
  - url: asyncapi/chutes-asyncapi.yml
    type: AsyncAPI
  - url: collections/chutes.postman_collection.json
    type: Postman
  description: OpenAI-compatible chat completions across hundreds of open-source models
    (DeepSeek, Qwen, Llama, GLM, Mistral, and more) served on the Chutes network at
